name: CI/CD - frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC login to Azure
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This file is copied verbatim by the Scaffolder (copyWithoutRender in template.yaml) since
      # GitHub Actions expressions use the same ${{ }} delimiter as Backstage's Nunjucks templating.
      # Per-app values are derived at runtime from the repo name instead.
      - name: Derive app and resource names
        run: |
          APP_NAME="${GITHUB_REPOSITORY##*/}"
          APP_NAME="${APP_NAME%-frontend}"
          ENVIRONMENT="dev"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=rg-$APP_NAME-$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "ACR_NAME=acr${APP_NAME//-/}$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "CONTAINER_APP_NAME=$APP_NAME-frontend" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=$APP_NAME-frontend" >> "$GITHUB_ENV"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Resolve backend API URL
        id: api
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.APP_NAME }}-backend" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build \
            --build-arg VITE_API_URL="${{ steps.api.outputs.url }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "$IMAGE"

      - name: Summary
        run: |
          FQDN=$(az containerapp show --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend URL: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
