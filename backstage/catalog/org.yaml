# Example org data — teams and owners available as picker options in the
# "Create Application" template's ownerRef/teamRef fields.
# In production this would sync from GitHub org teams/members instead of being hand-maintained.
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Owns the Backstage IDP itself and the shared Terraform modules.
spec:
  type: team
  children: []

---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: payments-team
  description: Owns payments-domain applications.
spec:
  type: team
  children: []

---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: alice
spec:
  memberOf: [platform-team]

---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: bob
spec:
  memberOf: [payments-team]
